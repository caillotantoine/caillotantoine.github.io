<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <link rel="stylesheet" href="./style/reset.css">

        <link rel="stylesheet" href="./style/style.css">

            gtag('js', new Date());

            gtag('config', 'G-8SH8G63HM9');

        <script src="script/base.js"></script>

    <body onload="loadHTML('template/header.html', 'header'); loadHTML('template/footer.html', 'footer');">
        <div id="header"></div>
        <div onclick="closeNavMenu()">

        <div style="height: 10vh;"></div>

        <main class="researchPage">
            <section class="normalSection">
                <h1>Research</h1>
                <p class="pageIntro">Publications and funding records are retrieved from <a href="https://orcid.org/0000-0002-6843-7255" target="_blank" rel="noopener noreferrer">ORCID</a>. Selected works link to their project pages.</p>
                <p id="publicationsStatus" role="status">Loading publications...</p>
            </section>

            <section class="normalSection publicationSection">
                <h2>Peer-Reviewed Journals</h2>
                <ul id="journal" class="publicationList"></ul>
            </section>

            <section class="normalSection publicationSection">
                <h2>Peer-Reviewed Conference Proceedings</h2>
                <ul id="conference" class="publicationList"></ul>
            </section>

            <section class="normalSection publicationSection">
                <h2>Funding</h2>
                <ul id="grant" class="publicationList"></ul>
                <p id="fundingsStatus" role="status"></p>
            </section>

            <section class="normalSection publicationSection">
                <h2>Thesis</h2>
                <ul id="thesis" class="publicationList"></ul>
            </section>
        </main>
        <script>document.addEventListener('DOMContentLoaded', () => loadPublications());</script>



        </div>
        <div id="footer"></div>
